{% set endpoint = request.endpoint or "" %}
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ url_for('views.index') }}">
      <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="" width="36" height="36">
      <span class="brand-text">
        <strong>Қазан</strong>
        <small>дәмхана · жеткізу</small>
      </span>
    </a>
    <button class="nav-toggle" type="button" aria-label="Мәзірді ашу" aria-expanded="false" data-nav-toggle>
      <span></span><span></span><span></span>
    </button>
    <nav class="main-nav" data-nav>
      <a href="{{ url_for('views.index') }}" class="{{ 'active' if endpoint == 'views.index' }}">Басты бет</a>
      <a href="{{ url_for('catalog.index') }}" class="{{ 'active' if endpoint.startswith('catalog.') }}">Мәзір</a>
      <a href="{{ url_for('views.delivery') }}" class="{{ 'active' if endpoint == 'views.delivery' }}">Жеткізу шарттары</a>
      <a href="{{ url_for('orders.track') }}" class="{{ 'active' if endpoint == 'orders.track' }}">Тапсырыс күйі</a>
      <a href="{{ url_for('cart.view') }}" class="nav-cart {{ 'active' if endpoint.startswith('cart.') }}">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 4h2l2.4 10.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 7H6.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="19" r="1.4" fill="currentColor"/><circle cx="17" cy="19" r="1.4" fill="currentColor"/></svg>
        Себет
        <span class="cart-badge" data-cart-count>{{ cart_count }}</span>
      </a>
    </nav>
  </div>
</header>
