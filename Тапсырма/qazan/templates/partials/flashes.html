{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="flash-stack container" role="status">
    {% for category, message in messages %}
    <div class="flash flash-{{ category }}">
      <span>{{ message }}</span>
      <button type="button" class="flash-close" aria-label="Жабу" data-flash-close>&times;</button>
    </div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}
